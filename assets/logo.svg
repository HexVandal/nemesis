<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="nemesis mark">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="mMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="mGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#16202e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#mBg)"/>
  <rect width="256" height="256" rx="56" fill="url(#mGrid)" opacity="0.6"/>

  <!-- the mark: a delta (change) inside a shield -->
  <g filter="url(#mGlow)">
    <path d="M128 40 L200 68 V132 C200 176 168 202 128 216 C88 202 56 176 56 132 V68 Z"
          fill="none" stroke="url(#mMark)" stroke-width="7" stroke-linejoin="round"/>
    <!-- delta split by a gap: baseline above, probe below -->
    <path d="M128 90 L168 146 H88 Z" fill="url(#mMark)" opacity="0.95"/>
    <path d="M128 158 L172 186 H84 Z" fill="url(#mMark)" opacity="0.55"/>
  </g>
</svg>

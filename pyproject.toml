[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis"
version = "0.1.0"
description = "The offensive-security scanner that thinks like a red team. Crawls, fingerprints, exploits and verifies."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "nemesis contributors" }]
keywords = [
    "security", "scanner", "pentest", "vulnerability", "appsec", "sast", "sca",
    "recon", "security-automation", "owasp", "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    # tomllib is stdlib from 3.11; 3.10 needs the backport or Cargo.toml
    # and pyproject.toml dependency parsing silently returns nothing.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.5"]
all = ["nemesis[dev]"]

[project.urls]
Homepage = "https://github.com/HexVandal/nemesis"
Issues = "https://github.com/HexVandal/nemesis/issues"

[project.scripts]
nemesis = "nemesis.cli:main"

[tool.setuptools.packages.find]
include = ["nemesis*"]

[tool.setuptools.package-data]
nemesis = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # typer wants defaults in the signature
    "B904",    # exception chaining is not always meaningful here
    "SIM108",  # ternaries are not always clearer
    "SIM110",  # explicit loops read better in hot paths
    "SIM117",  # nested context managers are clearer in TLS code
    "B007",    # unused loop variables document the tuple shape
    "RUF001",  # unicode in strings is intentional
    "RUF002",
    "RUF003",
    "RUF012",  # module classes use class-level lists as configuration
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["nemesis"]
